# Chargement automatique des dashboards depuis un dossier monté.
apiVersion: 1

providers:
  - name: HealthAI
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
